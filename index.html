<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f0e9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191c1b"
      media="(prefers-color-scheme: dark)"
    />
    <!-- What search engines and link previews read; the page then switches to the
         visitor's language (meta.home.* in lib/locales). -->
    <meta
      name="description"
      content="Free xiangqi (Chinese chess) in your browser: send a friend a link to play, practice against the computer and review your games move by move. No sign-up needed. 免费在线中国象棋：发链接约好友对弈、和 AI 练习、逐步复盘，无需注册。"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installing the site as an app; the service worker is web/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>
      Play Xiangqi Online with Friends or AI · Chuhan Xiangqi 楚汉棋社
    </title>
    <!-- No canonical or og:url here: invitations are /?room=… links, and Facebook would
         send a shared invitation to the canonical address instead of the room. -->

    <meta property="og:site_name" content="楚汉棋社 Chuhan Xiangqi" />
    <meta
      property="og:title"
      content="Play Xiangqi Online with Friends or AI · Chuhan Xiangqi 楚汉棋社"

    />
    <meta
      property="og:image"
      content="https://chuhanxiangqi.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The 楚汉棋社 Chuhan Xiangqi seal and name beside three xiangqi pieces on a board"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Play Xiangqi Online with Friends or AI · Chuhan Xiangqi 楚汉棋社"
    />

      name="twitter:description"
      content="Free xiangqi (Chinese chess) in your browser: send a friend a link to play, practice against the computer and review your games move by move. No sign-up needed. 免费在线中国象棋：发链接约好友对弈、和 AI 练习、逐步复盘，无需注册。"
    />
    <meta
      name="twitter:image"
      content="https://chuhanxiangqi.com/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="The 楚汉棋社 Chuhan Xiangqi seal and name beside three xiangqi pieces on a board"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Chuhan Xiangqi",
            "alternateName": "楚汉棋社",
            "url": "https://chuhanxiangqi.com/"
          },
          {
            "@type": "WebApplication",
            "name": "Chuhan Xiangqi",
            "alternateName": "楚汉棋社",
            "url": "https://chuhanxiangqi.com/",
            "image": "https://chuhanxiangqi.com/og-image.png",
            "description": "Free xiangqi (Chinese chess) in your browser: send a friend a link to play, practice against the computer and review your games move by move.",
            "applicationCategory": "GameApplication",
            "genre": "Xiangqi",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": ["zh-CN", "en"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
